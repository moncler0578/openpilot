name: C2HUD Cluster update
on:
  pull_request:
    branches: [g_c2hud]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/c2hud-cluster-update
      - name: Port compatible carrot-wip Cluster HUD improvements
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, sentinel=None):
            p = Path(path)
            s = p.read_text(encoding='utf-8')
            if sentinel and sentinel in s:
              return
            if old not in s:
              raise SystemExit('marker missing: ' + path)
            p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # Params registration
          replace_once('selfdrive/common/params.cc',
            '    {"EonClusterHudPanelLayout", PERSISTENT},\n',
            '    {"EonClusterHudPanelLayout", PERSISTENT},\n    {"EonClusterHudScreenMode", PERSISTENT},\n    {"EonClusterHudTheme", PERSISTENT},\n',
            'EonClusterHudScreenMode')

          # Defaults
          replace_once('selfdrive/manager/manager.py',
            '    ("EonClusterHudPanelLayout", "0"),\n',
            '    ("EonClusterHudPanelLayout", "0"),\n    ("EonClusterHudScreenMode", "0"),\n    ("EonClusterHudTheme", "0"),\n',
            '("EonClusterHudScreenMode", "0")')

          # Settings UI
          replace_once('selfdrive/ui/qt/offroad/settings.cc',
            '  list->addItem(new ParamValueControlF("EonClusterHudPanelLayout",\n      "클러스터 HUD 패널 배치", "0: 왼쪽 / 1: 오른쪽",\n      "../assets/offroad/icon_road.png", 0, 1, 1, 0, 0, this));\n',
            '  list->addItem(new ParamValueControlF("EonClusterHudPanelLayout",\n      "클러스터 HUD 패널 배치", "0: 주행 왼쪽 / 1: 주행 오른쪽",\n      "../assets/offroad/icon_road.png", 0, 1, 1, 0, 0, this));\n  list->addItem(new ParamValueControlF("EonClusterHudScreenMode",\n      "클러스터 HUD 화면 모드", "0: 자동(내비/주행리포트) / 2: 시스템 상태 / 5: 주행리포트 고정",\n      "../assets/offroad/icon_road.png", 0, 5, 1, 0, 0, this));\n  list->addItem(new ParamValueControlF("EonClusterHudTheme",\n      "클러스터 HUD 테마", "0: 자동 / 1: 다크 / 2: 라이트. 주행리포트와 시스템 패널에 적용됩니다.",\n      "../assets/offroad/icon_road.png", 0, 2, 1, 0, 0, this));\n',
            'EonClusterHudScreenMode')

          # Main process: add screen/theme and system-health snapshot.
          p = Path('selfdrive/eon_cluster/eon_cluster.py')
          s = p.read_text(encoding='utf-8')
          if 'PARAM_SCREEN_MODE' not in s:
            s = s.replace('PARAM_JPEG_QUALITY = "EonClusterHudJpegQuality"\n',
                          'PARAM_JPEG_QUALITY = "EonClusterHudJpegQuality"\nPARAM_SCREEN_MODE = "EonClusterHudScreenMode"\nPARAM_THEME = "EonClusterHudTheme"\n', 1)
          old = '        scene["panel_layout"] = _param_int(params, "EonClusterHudPanelLayout", 0, 0, 1)\n'
          if 'scene["screen_mode"]' not in s:
            new = old + '''        scene["screen_mode"] = _param_int(params, PARAM_SCREEN_MODE, 0, 0, 5)\n        scene["theme"] = _param_int(params, PARAM_THEME, 0, 0, 2)\n        cpu_values = list(_field(device_state, "cpuUsagePercent", []) or [])\n        temp_values = list(_field(device_state, "cpuTempC", []) or [])\n        free_space = float(_field(device_state, "freeSpacePercent", 0.0) or 0.0)\n        scene["system"] = {\n          "cpu": (sum(float(v) for v in cpu_values) / len(cpu_values)) if cpu_values else 0.0,\n          "temp": (sum(float(v) for v in temp_values) / len(temp_values)) if temp_values else 0.0,\n          "memory": float(_field(device_state, "memoryUsagePercent", 0.0) or 0.0),\n          "disk": max(0.0, min(100.0, 100.0 - free_space)) if free_space > 0.0 else 0.0,\n          "cores": [float(v) for v in cpu_values[:8]],\n        }\n'''
            if old not in s: raise SystemExit('eon_cluster panel marker missing')
            s = s.replace(old, new, 1)
          old2 = '        frame = renderer.render(speed_kph, cruise_kph, enabled, read_navi_state(), scene)\n'
          if 'navi_state = read_navi_state()' not in s:
            new2 = '        navi_state = read_navi_state()\n        scene["navi_live"] = bool(navi_state)\n        frame = renderer.render(speed_kph, cruise_kph, enabled, navi_state, scene)\n'
            if old2 not in s: raise SystemExit('render marker missing')
            s = s.replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')

          # Renderer: system panel + theme-aware report + screen modes.
          p = Path('selfdrive/eon_cluster/renderer.py')
          s = p.read_text(encoding='utf-8')
          if 'def _theme_colors' not in s:
            marker = '  def _draw_trip_report(self, draw, box, report):\n'
            helper = '''  def _theme_colors(self, theme):\n    # carrot-wip compatible simple theme mapping: 0 auto(default dark), 1 dark, 2 light.\n    if int(theme or 0) == 2:\n      return {"bg": (235, 239, 243), "card": (250, 251, 252), "line": (180, 188, 196),\n              "primary": (25, 31, 38), "secondary": (90, 102, 114), "accent": (32, 123, 214)}\n    return {"bg": (7, 12, 18), "card": (16, 23, 32), "line": (55, 68, 80),\n            "primary": (235, 240, 245), "secondary": (145, 158, 168), "accent": (64, 181, 255)}\n\n  def _draw_system_panel(self, draw, box, system, theme=0):\n    colors = self._theme_colors(theme)\n    left, top, right, bottom = box\n    draw.rectangle(box, fill=colors["bg"])\n    draw.text(((left + right) // 2, top + 38), "SYSTEM",\n              font=_font(max(24, self.height // 12), True), fill=colors["primary"], anchor="mm")\n    metrics = (("CPU", float(system.get("cpu", 0.0) or 0.0), "%"),\n               ("TEMP", float(system.get("temp", 0.0) or 0.0), " C"),\n               ("MEM", float(system.get("memory", 0.0) or 0.0), "%"),\n               ("DISK", float(system.get("disk", 0.0) or 0.0), "%"))\n    card_w = max(1, (right - left - 66) // 2)\n    card_h = max(62, (bottom - top - 150) // 2)\n    for i, (label, value, unit) in enumerate(metrics):\n      col, row = i % 2, i // 2\n      x0 = left + 22 + col * (card_w + 22)\n      y0 = top + 72 + row * (card_h + 18)\n      x1, y1 = x0 + card_w, min(bottom - 18, y0 + card_h)\n      draw.rounded_rectangle((x0, y0, x1, y1), radius=14, fill=colors["card"], outline=colors["line"], width=2)\n      draw.text((x0 + 14, y0 + 16), label, font=_font(max(16, self.height // 24), True), fill=colors["secondary"], anchor="la")\n      text = ("%.0f" % value) + unit\n      draw.text(((x0 + x1) // 2, (y0 + y1) // 2 + 10), text,\n                font=_font(max(26, self.height // 10), True), fill=colors["primary"], anchor="mm")\n    cores = system.get("cores") or []\n    if cores:\n      core_text = "  ".join("C%d %.0f%%" % (i, float(v)) for i, v in enumerate(cores))\n      draw.text(((left + right) // 2, bottom - 13), core_text,\n                font=_font(max(12, self.height // 30)), fill=colors["secondary"], anchor="ms")\n\n'''
            if marker not in s: raise SystemExit('trip marker missing')
            s = s.replace(marker, helper + marker, 1)
          # Theme-aware report body.
          old = '''  def _draw_trip_report(self, draw, box, report):\n    left, top, right, bottom = box\n    draw.rectangle(box, fill=(7, 12, 18))\n'''
          if 'def _draw_trip_report(self, draw, box, report, theme=0):' not in s:
            new = '''  def _draw_trip_report(self, draw, box, report, theme=0):\n    colors = self._theme_colors(theme)\n    left, top, right, bottom = box\n    draw.rectangle(box, fill=colors["bg"])\n'''
            if old not in s: raise SystemExit('trip signature marker missing')
            s = s.replace(old, new, 1)
            s = s.replace('font=_font(title_size, True), fill=(235, 240, 245), anchor="mm")', 'font=_font(title_size, True), fill=colors["primary"], anchor="mm")', 1)
            s = s.replace('fill=(16, 23, 32), outline=(55, 68, 80), width=2)', 'fill=colors["card"], outline=colors["line"], width=2)', 1)
            s = s.replace('font=_font(body_size, True), fill=(145, 158, 168), anchor="lm")', 'font=_font(body_size, True), fill=colors["secondary"], anchor="lm")', 1)
            s = s.replace('font=_font(body_size, True), fill=(235, 240, 245), anchor="rm")', 'font=_font(body_size, True), fill=colors["primary"], anchor="rm")', 1)
          old_render = '''    if scene.get("parked") and scene.get("trip_report"):\n      self._draw_trip_report(draw, info_box, scene["trip_report"])\n    else:\n      self._draw_navi_panel(image, draw, info_box, navi)\n'''
          if 'screen_mode = int(scene.get("screen_mode"' not in s:
            new_render = '''    screen_mode = int(scene.get("screen_mode", 0) or 0)\n    theme = int(scene.get("theme", 0) or 0)\n    if screen_mode == 2:\n      self._draw_system_panel(draw, info_box, scene.get("system") or {}, theme)\n    elif screen_mode == 5:\n      self._draw_trip_report(draw, info_box, scene.get("trip_report") or {}, theme)\n    elif not navi and scene.get("trip_report"):\n      # carrot-wip mode 0 behavior: live navigation when available, otherwise driving report.\n      self._draw_trip_report(draw, info_box, scene["trip_report"], theme)\n    else:\n      self._draw_navi_panel(image, draw, info_box, navi)\n'''
            if old_render not in s: raise SystemExit('render info marker missing')
            s = s.replace(old_render, new_render, 1)
          p.write_text(s, encoding='utf-8')
          PY
          python3 -m py_compile selfdrive/eon_cluster/*.py
          grep -q 'EonClusterHudScreenMode' selfdrive/common/params.cc
          grep -q 'screen_mode = int(scene.get' selfdrive/eon_cluster/renderer.py
          grep -q 'def _draw_system_panel' selfdrive/eon_cluster/renderer.py
          rm -f .github/workflows/c2hud_cluster_update_temp.yml
          git add -A
          git commit -m "Port carrot-wip Cluster HUD screen and system updates"
          git push --force-with-lease origin HEAD:agent/c2hud-cluster-update
